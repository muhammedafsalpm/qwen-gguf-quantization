# Qwen3-8B: settings for the quantization pipeline (text-only Qwen3 model).
#     python run_all.py --config configs/qwen3-8b.yaml
# Every script in pipeline/ and tools/ accepts --config configs/qwen3-8b.yaml.

model:
  repo_id: Qwen/Qwen3-8B             # official BF16 weights on Hugging Face
  revision: main                   # step 01 records the exact commit SHA used
  local_dir: models/Qwen3-8B
  name: Qwen3-8B                     # used in output file names
  license: apache-2.0
  vision: false                    # text only: no vision projector
  reasoning_effort: false          # Qwen3 thinking is on/off only (enable_thinking)

llama_cpp:
  src: tools/llama.cpp
  bin: tools/llama-bin
  build: b12345

paths:                             # one folder per model, so models never overwrite each other
  out: out/Qwen3-8B
  data: data/Qwen3-8B
  logs: logs/Qwen3-8B
  results: results/Qwen3-8B
  release: release/Qwen3-8B

convert:
  outtype: bf16
  mmproj_outtype: f16              # unused (no vision)

quantize:
  reference: Q8_0
  types: [Q8_0, Q6_K, Q5_K_M, Q4_K_M, IQ4_XS, Q3_K_M, IQ3_M]
  no_imatrix: [Q8_0]

calibration:
  seed: 42
  target_tokens: 160000            # ~312 chunks of 512 tokens
  max_chars_per_sample: 8000       # stop one long sample from dominating
  # share = fraction of target_tokens drawn from each source
  sources:
    - name: general
      repo: Salesforce/wikitext
      file: wikitext-2-raw-v1/train-00000-of-00001.parquet
      kind: plain
      text: text
      share: 0.20
    - name: chat
      repo: HuggingFaceH4/ultrachat_200k
      file: data/test_sft-00000-of-00001-f7dfac4afe5b93f4.parquet
      kind: messages
      messages: messages
      share: 0.20
    - name: math
      repo: openai/gsm8k
      file: main/train-00000-of-00001.parquet
      kind: qa
      prompt: question
      response: answer
      share: 0.15
    - name: code
      repo: iamtarun/python_code_instructions_18k_alpaca
      file: data/train-00000-of-00001-8b6e212f3e1ece96.parquet
      kind: qa
      prompt: instruction
      response: output
      share: 0.15
    - name: reasoning                # contains <think> traces -> protects thinking mode
      repo: nvidia/OpenCodeReasoning
      file: split_0/train-00000-of-00030.parquet
      kind: qa
      prompt: input
      response: output
      max_chars: 6000                # shorter clips -> more distinct problems
      share: 0.20
    - name: multilingual
      repo: CohereLabs/aya_dataset
      file: data/train-00000-of-00001.parquet
      kind: qa
      prompt: inputs
      response: targets
      share: 0.10

imatrix:
  source: bf16                       # BF16 fits fully in 48 GB VRAM, so use the exact original
  ctx: 512
  ngl: 99
  chunks: -1

eval:
  # Held-out text: wikitext-2 TEST split (calibration uses the TRAIN split)
  repo: Salesforce/wikitext
  file: wikitext-2-raw-v1/test-00000-of-00001.parquet
  ctx: 512
  chunks: 150
  base_ngl: 99                     # BF16 fits fully in VRAM
  ngl: 99
  server_port: 8089
  server_ctx: 16384

card:
  tags: [gguf, qwen3, qwen, quantized, imatrix, thinking, reasoning, tool-calling, multilingual, llama.cpp, conversational]
  language: [en, zh, hi, ml, ta, te, bn, ar, fr, de, es, pt, ru, ja, ko, vi, id, th, tr]  # Qwen3 supports 100+ languages
  quick_start: true                # one-line run command at the top of the card
  highlights:                      # "Why these quants" (measured facts only)
    - "**Importance matrix from the original BF16 model**, computed on 164K tokens of chat, code, math, reasoning traces (thinking mode) and multilingual text, rendered with Qwen3's own chat template."
    - "**Every file measured against BF16:** KL divergence, perplexity and same-top-token rate, so you can choose a size by measured quality."
    - "**I-quants included** (IQ4_XS, IQ3_M) for 6–8 GB GPUs, next to the standard K-quants."
    - "**Functionally tested:** thinking on, thinking off and tool calling on every file, plus 43 graded questions per file (reasoning, math, code, SQL, Malayalam and Hindi)."
    - "**Measured per language:** accuracy against BF16 on Malayalam, Hindi and Python code, not only English."
    - "**Standard Qwen3 GGUF:** tested in llama.cpp and Ollama; LM Studio and other llama.cpp apps load it too."
  context_gb: 1.5                  # GPU memory for ~8K tokens of context (standard attention)
  language_results: true           # include results/Qwen3-8B/kld_by_language.json if present
  ollama: "0.40.18"                # tested: Q4_K_M loads and answers correctly in Ollama 0.40.18
  test_summary: |                  # verified by reading the answers (results/Qwen3-8B/compare/)
    Every quant answered the same questions at temperature 0 with
    [`compare_quants.py`](https://github.com/muhammedafsalpm/qwen-gguf-quantization/blob/main/tools/compare_quants.py).
    Automatic checks were confirmed by reading the answers.

    | Quant | Basic (12) | Extended (17) | English / Malayalam / Hindi (14) |
    |---|---|---|---|
    | Q8_0 | 11 | 15 | 14 |
    | Q6_K | 12 | 16 | 14 |
    | Q5_K_M | 12 | 16 | 14 |
    | Q4_K_M | 12 | 17 | 13 |
    | IQ4_XS | 12 | 16 | 14 |
    | Q3_K_M | 11 | 16 | 14 |
    | IQ3_M | 12 | 17 | 12 |

    - Extended: Q8_0, IQ4_XS and Q3_K_M each reached the 8,192-token thinking limit on one question before answering.
      Q8_0, Q6_K and Q5_K_M did not insist on approval before sending an email in the agentic planning question.
    - Malayalam: the 8B model often uses non-standard or misspelled Malayalam words, even at Q8_0 (for example
      a non-standard word for Friday, or a misspelled "Delhi"). Q4_K_M and IQ3_M gave a wrong weekday in Malayalam;
      IQ3_M also made an arithmetic error in Hindi.
    - These are small samples (one run per question); differences of one answer are within normal variation.
  notes:
    Q8_0: "Near-lossless. Best accuracy"
    Q6_K: "Excellent quality"
    Q5_K_M: "Very high quality"
    Q4_K_M: "**Recommended default.** Best balance"
    IQ4_XS: "Smallest 4-bit"
    Q3_K_M: "Noticeable quality loss"
    IQ3_M: "Smallest file; noticeable quality loss"
  gpu_guide:                       # from the measured file sizes + ~1.5 GB for 8K context
    - "- **12 GB+ GPU:** Q8_0 (practically identical to the original)"
    - "- **10 GB:** Q6_K"
    - "- **8 GB (RTX 3070 / 4060):** Q4_K_M (the usual default), or Q5_K_M with a shorter context"
    - "- **6 GB:** IQ4_XS with a short context, or Q3_K_M / IQ3_M"

hf:
  username: muhammed-afsal-p-m
  repo_id: muhammed-afsal-p-m/Qwen3-8B-GGUF
  private: false
  collection_title: Qwen3 Quants
  github_url: https://github.com/muhammedafsalpm/qwen-gguf-quantization  # linked from the model card
